org: rzlab
service: keepcloud-web

provider:
  name: aws
  stage: ${env:STAGE}
  region: eu-west-3
  deploymentBucket:
  name: keepcloud.api.deployment
  
plugins:
  - serverless-s3-sync

package:
  individually: true

custom:
  domainName:
    dev: ${env:STAGE}-keepcloud.${env:DOMAIN_NAME}
    production: keepcloud.${env:DOMAIN_NAME}
  s3Sync:
    - bucketName: ${self:custom.domainName.${env:STAGE}}
      localDir: ../../dist/apps/web/client/
resources:
  Resources:
    S3Bucket:
      Type: 'AWS::S3::Bucket'
      Properties:
        BucketName: ${self:custom.domainName.${env:STAGE}}
        AccessControl: Private
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Aliases:
            - ${self:custom.domainName.${env:STAGE}}
          HttpVersion: http2
          ViewerCertificate:
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
            AcmCertificateArn: ${env:AWS_ACM_CERTIFICATE_ARN}
          Origins:
            - Id: keepcloud-web-origin-${env:STAGE}
              DomainName: ${self:custom.domainName.${env:STAGE}}.s3.amazonaws.com
              OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
          DefaultCacheBehavior:
            ViewerProtocolPolicy: redirect-to-https
            TargetOriginId: keepcloud-web-origin-${env:STAGE}
            ForwardedValues:
              QueryString: 'true'
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ErrorCachingMinTTL: 10 # Cache for 10 seconds
              ResponsePagePath: /index.html
    CloudFrontOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: keepcloud-web-oac
          Description: KeepCloud Web OAC
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    DnsRecord:
      Type: 'AWS::Route53::RecordSet'
      Properties:
        HostedZoneId: ${env:HOSTED_ZONE_ID}
        Name: ${self:custom.domainName.${env:STAGE}}
        Type: 'A'
        AliasTarget:
          EvaluateTargetHealth: false
          DNSName: !GetAtt [CloudFrontDistribution, DomainName]
          HostedZoneId: Z2FDTNDATAQYW2 #This is always the hosted zone ID when you create an alias record that routes traffic to a CloudFront distribution.

